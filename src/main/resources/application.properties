# Tên ứng dụng
spring.application.name=review-revenue-system

# Cổng chạy ứng dụng (mặc định 8080)
server.port=8080

# ===== CẤU HÌNH H2 DATABASE =====
# Bật console H2 để xem dữ liệu trực tiếp
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Cấu hình kết nối H2 (in-memory, lưu trong bộ nhớ)
spring.datasource.url=jdbc:h2:mem:reviewdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate cấu hình
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
